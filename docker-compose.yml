name: socpuppet_ui

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socpuppet_ui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-socpuppet_ui}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socpuppet_ui} -d ${POSTGRES_DB:-socpuppet_ui}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  socpuppet_ui:
    # Built from this checkout. The previous reference was a third-party
    # namespace whose repository is gone: whoever controls that name could
    # publish the tag this file would pull.
    build:
      context: .
      args:
        SOCPUPPET_UI_VERSION: ${SOCPUPPET_UI_VERSION:-dev}
    image: socpuppet:local
    # Agent processes run as an unprivileged executor (-exec-uid): no setuid program
    # or file capability may raise them back to root.
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SOCPUPPET_UI_PG_DSN: postgres://${POSTGRES_USER:-socpuppet_ui}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-socpuppet_ui}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SOCPUPPET_UI_LLM_PROVIDER: ${SOCPUPPET_UI_LLM_PROVIDER:-}
      SOCPUPPET_UI_LLM_MODEL: ${SOCPUPPET_UI_LLM_MODEL:-}
      SOCPUPPET_UI_LLM_BASE_URL: ${SOCPUPPET_UI_LLM_BASE_URL:-}
      SOCPUPPET_UI_LLM_PROXY: ${SOCPUPPET_UI_LLM_PROXY:-}
      # Exact host:port list the model-list fetch may reach on private addresses (e.g. host.docker.internal:11434 for Ollama).
      SOCPUPPET_UI_LLM_PRIVATE_ENDPOINTS: ${SOCPUPPET_UI_LLM_PRIVATE_ENDPOINTS:-}
      SOCPUPPET_UI_JWT_KEY_DIR: /app/keys
      # Optional: key for secrets at rest; empty = keys/secret.key (generated at first start).
      SOCPUPPET_UI_SECRET_KEY: ${SOCPUPPET_UI_SECRET_KEY:-}
      SOCPUPPET_UI_TRUSTED_PROXIES: ${SOCPUPPET_UI_TRUSTED_PROXIES:-}
      # Untrusted-output boundary: on by default (empty = on); SOCPUPPET_UI_UNTRUSTED_BOUNDARY=0 in .env
      # disables it. Cost: about 154 bytes per tool result plus one system note.
      SOCPUPPET_UI_UNTRUSTED_BOUNDARY: ${SOCPUPPET_UI_UNTRUSTED_BOUNDARY:-}
      SOCPUPPET_UI_UPDATE_CHECK: ${SOCPUPPET_UI_UPDATE_CHECK:-}
      # Noise profile for target requests: off (default) | quiet | balanced | aggressive.
      SOCPUPPET_UI_NOISE_PROFILE: ${SOCPUPPET_UI_NOISE_PROFILE:-}
      SOCPUPPET_UI_TARGET_USER_AGENT: ${SOCPUPPET_UI_TARGET_USER_AGENT:-}
      # Hierarchical run budgets: unset or 0 = unlimited (no change). See README.
      SOCPUPPET_UI_TASK_BUDGET_TOKENS: ${SOCPUPPET_UI_TASK_BUDGET_TOKENS:-}
      SOCPUPPET_UI_TASK_BUDGET_TURNS: ${SOCPUPPET_UI_TASK_BUDGET_TURNS:-}
      SOCPUPPET_UI_INTENT_BUDGET_TOKENS: ${SOCPUPPET_UI_INTENT_BUDGET_TOKENS:-}
      SOCPUPPET_UI_INTENT_BUDGET_TURNS: ${SOCPUPPET_UI_INTENT_BUDGET_TURNS:-}
    ports:
      - "${SOCPUPPET_UI_BIND_ADDR:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the runtime data directory (traffic index, task files, transcripts, etc.) to data/ in the project root,
      # so it is easy to inspect/back up on the host and survives container rebuilds.
      - ./data:/app/data
      # JWT signing key and secret key (jwt.key, secret.key), kept out of data/, which the file manager browses.
      # Persisting it keeps users signed in across container rebuilds.
      - ./keys:/app/keys
      # Mount skills/ from the project root into the container (overriding the image's built-in /app/skills);
      # skill changes require no image rebuild — the container reads the host copy.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
